services:
  commercial-portal-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: commercial_portal_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0 --port 3000
    networks:
      - commercial-dev-net

networks:
  commercial-dev-net:
    driver: bridge
