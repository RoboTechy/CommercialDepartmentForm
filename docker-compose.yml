services:
  commercial-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: commercial-department-portal:latest
    container_name: commercial_portal_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - commercial-net

networks:
  commercial-net:
    driver: bridge
